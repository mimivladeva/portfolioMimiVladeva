
name: Deploy Angular Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --configuration production --base-href /portfolioMimiVladeva/

      - name: Locate Angular build output
        id: output
        run: |
          INDEX_FILE=$(find dist -type f -name index.html | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "Angular build output not found."
            exit 1
          fi

          OUTPUT_DIR=$(dirname "$INDEX_FILE")
          echo "path=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
